<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Booking</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body>

    <div class="container py-4">
        <!-- Header -->
        <header class="d-flex flex-wrap align-items-center justify-content-between pb-3 mb-4 border-bottom">
            <h1 class="h2 mb-0"><i class="fas fa-hospital-user text-primary me-2"></i>Clinic Booking</h1>
            <span class="text-muted small">5 doctors • 30‑min slots</span>
        </header>

        <!-- Main row -->
        <div class="row g-4">
            <!-- LEFT COLUMN: Book Appointment -->
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0"><i class="fas fa-calendar-plus text-primary me-2"></i>Book a New Appointment</h5>
                    </div>
                    <div class="card-body">
                        <!-- Selection row -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="doctorSelect" class="form-label fw-semibold">Doctor</label>
                                <select id="doctorSelect" class="form-select">
                                    <option value="">— Select —</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="patientSelect" class="form-label fw-semibold">Patient</label>
                                <select id="patientSelect" class="form-select">
                                    <option value="">— Select —</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="dateInput" class="form-label fw-semibold">Date</label>
                                <input type="date" id="dateInput" class="form-control" min="{{ today|date:'Y-m-d' }}">
                            </div>
                        </div>

                        <!-- Check availability button -->
                        <button id="checkAvailabilityBtn" class="btn btn-primary w-100 mb-3">
                            <i class="fas fa-search me-2"></i>Check Availability
                        </button>

                        <!-- Slots grid -->
                        <div id="slotsContainer" class="mt-3">
                            <div class="text-muted text-center py-3" id="slotsPlaceholder">
                                <i class="fas fa-clock fa-2x d-block mb-2"></i>
                                Select a doctor, patient, and date, then click "Check Availability"
                            </div>
                            <div id="slotsGrid" class="d-flex flex-wrap gap-2" style="display:none;"></div>
                            <div id="slotMessage" class="text-center mt-2 small"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Upcoming Appointments -->
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0"><i class="fas fa-list-check text-success me-2"></i>Upcoming Appointments</h5>
                    </div>
                    <div class="card-body" id="appointmentsContainer">
                        <div class="text-muted text-center py-4" id="appointmentsPlaceholder">
                            <i class="fas fa-user-md fa-2x d-block mb-2"></i>
                            Select a patient above to see their upcoming appointments
                        </div>
                        <div id="appointmentsList" style="display:none;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reschedule Modal -->
        <div class="modal fade" id="rescheduleModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fas fa-calendar-alt me-2"></i>Reschedule Appointment</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>Select a new date and time for <strong id="reschedulePatientName"></strong> with <strong id="rescheduleDoctorName"></strong>.</p>
                        <div class="mb-3">
                            <label for="rescheduleDate" class="form-label">New Date</label>
                            <input type="date" id="rescheduleDate" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="rescheduleTime" class="form-label">New Time (30‑min slots)</label>
                            <input type="time" id="rescheduleTime" class="form-control" step="1800">
                        </div>
                        <div id="rescheduleError" class="alert alert-danger d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" id="confirmRescheduleBtn" class="btn btn-primary">Confirm Reschedule</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS + Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{% static 'frontend/js/app.js' %}"></script>
</body>
</html>
